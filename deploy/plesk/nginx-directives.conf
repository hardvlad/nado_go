# Вставить в Plesk: Websites & Domains → <домен> → Apache & nginx Settings →
# «Additional nginx directives». Там же снять «Proxy mode» и
# «Serve static files directly by nginx».
#
# Регулярное `location ~ /` вместо `location /`: Plesk уже объявляет
# `location /` сам, и дубликат ломает конфиг. Путь Let's Encrypt
# (/.well-known/acme-challenge/) у Plesk объявлен через ^~ и остаётся за ним,
# поэтому продление сертификата продолжает работать.

location ~ / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    # Чуть больше HTTP_WRITE_TIMEOUT приложения.
    proxy_read_timeout    35s;

    # Приложение само ограничивает JSON-тело 1 МиБ.
    client_max_body_size 2m;
}
